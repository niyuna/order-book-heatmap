<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Order Flow Visualizer</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./lightgrid.min.css">
    <style>
      /* 添加一些样式来实现同一行显示 */
      .input-row {
        display: flex;
        align-items: center;
        gap: 15px; /* 控件之间的间距 */
        margin-bottom: 10px;
      }
      
      /* 使 input-group 的样式与 input-wrapper 更一致 */
      .input-group, .input-wrapper {
        display: flex;
        align-items: center;
        margin-right: 15px;
      }
      
      /* 调整标签样式 */
      .input-group label, .label {
        font-size: 14px;
        color: #aaa;
        margin-right: 8px;
        font-weight: normal;
      }
      
      /* 统一所有按钮和输入控件的样式，参考 styles.css */
      button, select, input {
        background-color: #222;
        color: #ddd;
        border: 1px solid #444;
        border-radius: 3px;
        padding: 4px 8px;
        font-size: 14px;
        height: 28px;
        box-sizing: border-box;
        outline: none;
      }
      
      /* 输入控件焦点样式 */
      button:focus, select:focus, input:focus {
        border-color: #666;
        box-shadow: 0 0 3px rgba(102, 175, 233, 0.6);
      }
      
      /* 按钮悬停效果 */
      button:hover {
        background-color: #333;
        border-color: #555;
      }
      
      /* 禁用状态 */
      button:disabled, select:disabled, input:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      
      /* Apply 按钮特殊样式 */
      .apply-button {
        background-color: #1e5928;
        border-color: #1e5928;
        color: #fff;
      }
      
      .apply-button:hover {
        background-color: #2a6e2d;
        border-color: #2a6e2d;
      }
      
      /* Load 按钮特殊样式 */
      #load-historical-data {
        background-color: #1e4b6d;
        border-color: #1e4b6d;
        color: #fff;
      }
      
      #load-historical-data:hover {
        background-color: #2a5d8f;
        border-color: #2a5d8f;
      }
      
      /* 确保条形图容器有足够的高度 */
      .bar-chart-wrapper {
        min-height: 300px;
        padding-bottom: 40px; /* 为 X 轴标签留出空间 */
      }
      
      /* 确保整个页面有足够的高度 */
      body {
        min-height: 100vh;
        padding-bottom: 50px;
        background-color: #111;
        color: #ddd;
      }
      
      /* 工具提示样式 */
      .tooltip {
        position: absolute;
        background-color: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 5px 10px;
        border-radius: 3px;
        font-size: 12px;
        pointer-events: none;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.2s;
      }
      
      /* 历史数据控件容器 */
      .historical-data {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #333;
        border-radius: 4px;
        background-color: #1a1a1a;
      }
      
      /* 历史数据标题 */
      .historical-data h3 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 16px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="ui">
      <!-- 创建一个包含 feed 和 symbol 的行 -->
      <div class="input-row" id="feed-input-row">
        <div class="input-group">
          <label for="feed">Feed:</label>
          <select id="feed" onchange="updateSymbolInput()">
            <option value="binance">Binance</option>
            <option value="tse">TSE</option>
          </select>
        </div>

        <div class="input-group" id="binance-symbol-container">
          <label for="binance-symbol">Symbol:</label>
          <select id="binance-symbol">
            <option value="ETHUSDT">ETH/USDT</option>
            <option value="ADAUSDT">ADA/USDT</option>
            <option value="LTCUSDT" selected="selected">LTC/USDT</option>
            <option value="XRPUSDT">XRP/USDT</option>
            <option value="LINKUSDT">LINK/USDT</option>
            <option value="BCHUSDT">BCH/USDT</option>
          </select>
        </div>

        <div class="input-group" id="tse-symbol-container" style="display: none;">
          <label for="tse-symbol">Symbol:</label>
          <input type="text" id="tse-symbol" placeholder="Enter TSE symbol">
        </div>
      </div>

      <div class="update-interval input-wrapper">
        <div class="label">
          update every
        </div>
        <select class="input">
          <option value="100">100ms</option>
          <option value="250">250ms</option>
          <option value="500">500ms</option>
          <option value="1000">1s</option>
          <option value="5000" selected="selected">5s</option>
        </select>
      </div>

      <div class="heatmap-size input-wrapper">
        <div class="label">
          max heatmap size
        </div>

        <select class="input">
          <option value="1000" selected="selected">1000 periods</option>
          <option value="500">500 periods</option>
          <option value="250">250 periods</option>
          <option value="100">100 periods</option>
          <option value="25">25 periods</option>
        </select>
      </div>

      <div class="levels input-wrapper">
        <div class="label">
          bid/ask levels
        </div>
        <select class="input">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="40">40</option>
          <option value="80" selected="selected">80</option>
          <option value="120">120</option>
          <option value="150">150</option>
        </select>
      </div>

      <!-- TODO: fix aggregation -->
      <div class="aggregation input-wrapper" style="display: none">
        <div class="label">
          aggregate over
        </div>

        <select class="input">
          <option value="1" selected="selected">no aggregation</option>
          <option value="2">2 levels</option>
          <option value="5">5 levels</option>
          <option value="10">10 levels</option>
        </select>
      </div>

      <div class="scale input-wrapper">
        <div class="label">
          color scale 
        </div>

        <select class="input">
          <option value="linear" selected="selected">linear</option>
          <option value="log2">log2</option>
        </select>
      </div>

      <div class="theme input-wrapper">
        <div class="label">
          heatmap theme
        </div>

        <select class="input">
          <option value="rb">red & blue</option>
          <option value="bw" selected="selected">black & white</option>
        </select>
      </div>

      <div class="historical-data input-wrapper" style="display: none;">
        <div class="label">Historical Data</div>
        <div class="historical-controls">
          <label for="start-time">Start:</label>
          <input type="datetime-local" id="start-time">
          <label for="end-time">End:</label>
          <input type="datetime-local" id="end-time">
          <button id="load-historical-data">Load</button>
        </div>
      </div>
    </div>

    <div class="dashboard row">
      <div class="col-8 heatmap-wrapper">
        <span class="heatmap"></div>
      </span>
      <span class="side col-4">
        <div class="trades" style="display: none">
          <table>
            <thead>
              <tr>
                <th>Size</th>
                <th>Price</th>
                <th>Time</th>
              </tr>
            </thead>

            <tbody class="trades-body"></tbody>
          </table>
        </div>
        <div class="bar-chart-wrapper">
          <div class="limit-orders-bar-chart"></div>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
    <script>
    function updateSymbolInput() {
      const feed = document.getElementById('feed').value;
      const binanceContainer = document.getElementById('binance-symbol-container');
      const tseContainer = document.getElementById('tse-symbol-container');
      
      if (feed === 'binance') {
        binanceContainer.style.display = '';
        tseContainer.style.display = 'none';
      } else {
        binanceContainer.style.display = 'none';
        tseContainer.style.display = '';
      }
    }

    document.addEventListener('DOMContentLoaded', updateSymbolInput);
    </script>
  </body>
</html>
